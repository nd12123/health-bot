version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: health-bot-db
    environment:
      POSTGRES_USER: healthbot
      POSTGRES_PASSWORD: healthbot_dev_password_change_in_prod
      POSTGRES_DB: healthbot_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      # Persist data between container restarts
      - postgres_data:/var/lib/postgresql/data
      # Initialize database with seed if needed
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      # Mount project for migrations from within container
      - .:/workspace
    networks:
      - health-bot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthbot -d healthbot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: health-bot-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@healthbot.local
      PGADMIN_DEFAULT_PASSWORD: admin_password_change_in_prod
    ports:
      - "5050:80"
    networks:
      - health-bot-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  health-bot-network:
    driver: bridge
